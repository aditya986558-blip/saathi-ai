<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Saathi AI 🤖</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Baloo 2', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #1a1a2e, #16213e);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
      color: #e2e8f0;
    }
    .header { text-align: center; margin-bottom: 20px; animation: fadeDown 0.6s ease; }
    .header .emoji-h { font-size: 46px; animation: pulse 2s infinite; display: block; }
    .header h1 { font-size: 30px; font-weight: 800; color: #f59e0b; text-shadow: 0 0 24px rgba(245,158,11,0.5); letter-spacing: 2px; }
    .header .tagline { background: linear-gradient(90deg, #f59e0b, #ec4899, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 13px; font-weight: 600; margin-top: 4px; }

    .chat-box { width: 100%; max-width: 680px; background: rgba(255,255,255,0.04); border: 1px solid rgba(245,158,11,0.25); border-radius: 20px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.4); }

    .key-bar { padding: 12px 16px; background: rgba(0,0,0,0.3); border-bottom: 1px solid rgba(245,158,11,0.15); display: flex; gap: 8px; align-items: center; }
    .key-bar input { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(245,158,11,0.3); border-radius: 10px; padding: 8px 12px; color: #e2e8f0; font-size: 12px; font-family: monospace; outline: none; }
    .key-bar input:focus { border-color: #f59e0b; }
    .key-bar button { background: linear-gradient(135deg, #f59e0b, #d97706); border: none; border-radius: 10px; padding: 8px 14px; font-size: 12px; font-weight: 800; color: #000; cursor: pointer; font-family: 'Baloo 2', sans-serif; white-space: nowrap; }

    .messages { min-height: 300px; max-height: 400px; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: thin; scrollbar-color: rgba(245,158,11,0.3) transparent; }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: rgba(245,158,11,0.3); border-radius: 4px; }

    .empty-state { text-align: center; margin: auto; }
    .empty-state .big { font-size: 44px; display: block; margin-bottom: 8px; }
    .empty-state h3 { color: #94a3b8; font-size: 15px; font-weight: 600; }
    .empty-state p { color: #64748b; font-size: 12px; margin-top: 4px; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
    .suggestion-btn { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); color: #fbbf24; border-radius: 20px; padding: 7px 14px; font-size: 12px; cursor: pointer; font-family: 'Baloo 2', sans-serif; transition: all 0.2s; }
    .suggestion-btn:hover { background: rgba(245,158,11,0.2); }

    .msg { display: flex; align-items: flex-start; gap: 8px; animation: fadeIn 0.3s ease; }
    .msg.user { flex-direction: row-reverse; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #f59e0b, #d97706); display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; margin-top: 2px; }
    .bubble { max-width: 78%; padding: 10px 14px; font-size: 14px; line-height: 1.7; border-radius: 18px; }
    .msg.user .bubble { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; border-radius: 18px 18px 4px 18px; font-weight: 600; }
    .msg.ai .bubble { background: rgba(255,255,255,0.07); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.1); border-radius: 18px 18px 18px 4px; }

    .typing-bubble { display: flex; align-items: center; gap: 8px; animation: fadeIn 0.3s ease; }
    .typing-dots { display: flex; gap: 5px; padding: 12px 16px; background: rgba(255,255,255,0.07); border-radius: 18px 18px 18px 4px; border: 1px solid rgba(255,255,255,0.1); }
    .typing-dots span { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; animation: bounce 1.2s infinite; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    .input-area { padding: 14px 16px; border-top: 1px solid rgba(255,255,255,0.06); display: flex; gap: 10px; background: rgba(0,0,0,0.2); }
    textarea { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(245,158,11,0.25); border-radius: 14px; padding: 11px 14px; color: #e2e8f0; font-size: 14px; font-family: 'Baloo 2', sans-serif; resize: none; outline: none; transition: border 0.2s; line-height: 1.5; }
    textarea:focus { border-color: #f59e0b; }
    textarea::placeholder { color: #475569; }
    .send-btn { background: linear-gradient(135deg, #f59e0b, #d97706); border: none; border-radius: 14px; width: 48px; height: 48px; font-size: 20px; cursor: pointer; flex-shrink: 0; transition: all 0.2s; }
    .send-btn:hover { transform: scale(1.08); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .bottom-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; width: 100%; max-width: 680px; padding: 0 4px; }
    .clear-btn { background: transparent; border: 1px solid rgba(255,255,255,0.12); color: #64748b; border-radius: 20px; padding: 6px 16px; font-size: 12px; cursor: pointer; font-family: 'Baloo 2', sans-serif; transition: all 0.2s; }
    .clear-btn:hover { border-color: #ef4444; color: #ef4444; }
    .footer { font-size: 11px; color: #1e293b; margin-top: 20px; text-align: center; }

    .status { font-size: 11px; padding: 2px 8px; border-radius: 10px; }
    .status.on { background: rgba(34,197,94,0.15); color: #22c55e; }
    .status.off { background: rgba(239,68,68,0.15); color: #ef4444; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes fadeDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
  </style>
</head>
<body>

  <div class="header">
    <span class="emoji-h">🤖✨</span>
    <h1>⚡ Saathi AI 🧠</h1>
    <p class="tagline">🌟 Tumhara Smart Dost • Har Sawaal Ka Jawab 🚀</p>
  </div>

  <div class="chat-box">
    <!-- API KEY BAR -->
    <div class="key-bar">
      <input type="password" id="api-key-input" placeholder="🔑 Groq API Key yahan paste karo (gsk_...)" />
      <button onclick="saveKey()">✅ Save</button>
      <span class="status off" id="key-status">❌</span>
    </div>

    <!-- MESSAGES -->
    <div class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <span class="big">🌈💫</span>
        <h3>🔥 Koi bhi sawaal daaro, jhijhko mat!</h3>
        <p>📚 Science • 🧮 Maths • 🌍 History • 💡 GK • 🎁 Gift Ideas</p>
        <div class="suggestions">
          <button class="suggestion-btn" onclick="sendSuggestion(this)">🌿 Photosynthesis kya hai?</button>
          <button class="suggestion-btn" onclick="sendSuggestion(this)">⚡ Newton ke laws?</button>
          <button class="suggestion-btn" onclick="sendSuggestion(this)">🎁 Bhai ko gift kya doon?</button>
          <button class="suggestion-btn" onclick="sendSuggestion(this)">🧮 Pythagoras theorem?</button>
          <button class="suggestion-btn" onclick="sendSuggestion(this)">😊 Kaise ho tum?</button>
        </div>
      </div>
    </div>

    <!-- INPUT -->
    <div class="input-area">
      <textarea id="user-input" rows="1" placeholder="✍️ Apna sawaal yahan likho... (Enter dabao 🚀)" onkeydown="handleKey(event)"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <div class="bottom-bar">
    <button class="clear-btn" onclick="clearChat()">🗑️ Chat saaf karo</button>
    <span style="font-size:11px; color:#334155;">Groq Free ✅</span>
  </div>

  <p class="footer">🤖 Saathi AI · ⚡ Groq se Powered · 💛 Bilkul Free!</p>

<script>
  let API_KEY = "";
  let messages = [];

  function saveKey() {
    const key = document.getElementById("api-key-input").value.trim();
    if (!key || !key.startsWith("gsk_")) {
      alert("⚠️ Sahi key daalo! 'gsk_' se shuroo honi chahiye.");
      return;
    }
    API_KEY = key;
    const status = document.getElementById("key-status");
    status.textContent = "✅ Ready";
    status.className = "status on";
    document.getElementById("api-key-input").value = "••••••••••••••••••••";
  }

  function handleKey(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function sendSuggestion(btn) {
    document.getElementById("user-input").value = btn.textContent.slice(2);
    sendMessage();
  }

  async function sendMessage() {
    if (!API_KEY) { alert("⚠️ Pehle API key daalo aur Save karo!"); return; }
    const input = document.getElementById("user-input");
    const text = input.value.trim();
    if (!text) return;

    document.getElementById("empty-state").style.display = "none";
    messages.push({ role: "user", content: text });
    appendMessage("user", text);
    input.value = "";

    const btn = document.getElementById("send-btn");
    btn.disabled = true;
    const typingId = showTyping();

    try {
      const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${API_KEY}` },
        body: JSON.stringify({
          model: "llama-3.3-70b-versatile",
          max_tokens: 1000,
          messages: [
            { role: "system", content: Tum ek friendly AI ho jiska naam "Saathi AI" hai. Tumhare malik ka naam Aditya hai. Jab bhi user apna naam pooche toh "Aditya bhai" kaho. Hindi mein pooche toh Hindi mein jawab do, English mein pooche toh English mein. Har jawab mein emojis naturally use karo jaise ek dost baat karta hai. Simple aur warm bhasha use karo.
            ... message 
          ]
        })
      });
      const data = await res.json();
      removeTyping(typingId);
      if (data.choices && data.choices[0]) {
        const reply = data.choices[0].message.content;
        messages.push({ role: "assistant", content: reply });
        appendMessage("ai", reply);
      } else {
        appendMessage("ai", "❌ Kuch gadbad ho gayi! Key check karo 😅");
      }
    } catch {
      removeTyping(typingId);
      appendMessage("ai", "❌ Internet check karo aur dobara try karo! 🙏");
    }
    btn.disabled = false;
  }

  function appendMessage(role, text) {
    const container = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "👤" : "🤖";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = text.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>").split("\n").map(l => `<p style="margin:3px 0">${l}</p>`).join("");
    div.appendChild(avatar);
    div.appendChild(bubble);
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  function showTyping() {
    const container = document.getElementById("messages");
    const id = "typing-" + Date.now();
    const div = document.createElement("div");
    div.className = "typing-bubble"; div.id = id;
    div.innerHTML = `<div class="avatar">🤖</div><div class="typing-dots"><span></span><span></span><span></span></div>`;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    return id;
  }

  function removeTyping(id) { const el = document.getElementById(id); if (el) el.remove(); }

  function clearChat() {
    messages = [];
    document.getElementById("messages").innerHTML = `
      <div class="empty-state" id="empty-state">
        <span class="big">🌈💫</span>
        <h3>🔥 Koi bhi sawaal daaro, jhijhko mat!</h3>
        <p>📚 Science • 🧮 Maths • 🌍 History • 💡 GK • 🎁 Gift Ideas</p>
        <div class="suggestions">
          <button class="suggestion-btn" onclick="sendSuggestion(this)">🌿 Photosynthesis kya hai?</button>
          <button class="suggestion-btn" onclick="sendSuggestion(this)">⚡ Newton ke laws?</button>
          <button class="suggestion-btn" onclick="sendSuggestion(this)">🎁 Bhai ko gift kya doon?</button>
          <button class="suggestion-btn" onclick="sendSuggestion(this)">🧮 Pythagoras theorem?</button>
          <button class="suggestion-btn" onclick="sendSuggestion(this)">😊 Kaise ho tum?</button>
        </div>
      </div>`;
  }
</script>
</body>
</html>
