<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Saathi AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0a0a0a;--surface:#111111;--surface2:#1a1a1a;
  --border:#1e1e1e;--border2:#2a2a2a;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#475569;
  --accent:#3b82f6;--accent2:#2563eb;--purple:#7c3aed;
  --green:#22c55e;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Inter',sans-serif;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;align-items:center;color:var(--text);}

/* ── SETUP ── */
#setup-screen{width:100%;max-width:420px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;}
.setup-logo{font-size:52px;margin-bottom:16px;}
.setup-title{font-size:30px;font-weight:700;color:#fff;margin-bottom:6px;letter-spacing:-.5px;}
.setup-sub{font-size:14px;color:var(--text3);margin-bottom:36px;text-align:center;line-height:1.6;}
.setup-card{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px;}
.input-group{display:flex;flex-direction:column;gap:6px;}
.input-group label{font-size:11px;color:var(--text3);font-weight:600;letter-spacing:.8px;text-transform:uppercase;}
.setup-input{background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:13px 14px;color:var(--text);font-size:13px;font-family:'SF Mono','Fira Code',monospace;outline:none;width:100%;transition:border-color .2s;}
.setup-input:focus{border-color:var(--accent);}
.setup-input::placeholder{color:var(--text3);}
.start-btn{background:var(--accent);border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:600;color:#fff;cursor:pointer;font-family:'Inter',sans-serif;width:100%;margin-top:4px;transition:background .2s,transform .1s;}
.start-btn:hover{background:var(--accent2);}
.start-btn:active{transform:scale(.98);}
.skip-btn{background:transparent;border:1px solid var(--border2);border-radius:12px;padding:12px;font-size:13px;color:var(--text3);cursor:pointer;font-family:'Inter',sans-serif;width:100%;transition:border-color .2s,color .2s;}
.skip-btn:hover{border-color:var(--text3);color:var(--text2);}

/* ── CHAT ── */
#chat-screen{display:none;width:100%;max-width:680px;min-height:100vh;flex-direction:column;}

/* ── TOPBAR ── */
.topbar{position:sticky;top:0;background:rgba(10,10,10,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;z-index:100;}
.topbar-left{display:flex;align-items:center;gap:10px;}
.topbar-icon{width:36px;height:36px;background:linear-gradient(135deg,#3b82f6,#6366f1);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.topbar-info{display:flex;flex-direction:column;gap:2px;}
.topbar-name{font-size:15px;font-weight:600;color:#fff;}
.topbar-status{display:flex;align-items:center;gap:5px;}
.online-dot{width:7px;height:7px;background:var(--green);border-radius:50%;animation:pulse-dot 2.5s ease-in-out infinite;}
.topbar-online{font-size:11px;color:var(--green);font-weight:500;}
.icon-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--text3);cursor:pointer;font-size:14px;transition:background .15s,border-color .15s;}
.icon-btn:hover{background:var(--surface);border-color:var(--text3);}

/* ── MESSAGES ── */
.messages{flex:1;padding:28px 20px;display:flex;flex-direction:column;gap:24px;overflow-y:auto;min-height:0;}
.messages::-webkit-scrollbar{width:4px;}
.messages::-webkit-scrollbar-track{background:transparent;}
.messages::-webkit-scrollbar-thumb{background:#1e293b;border-radius:4px;}

/* ── EMPTY STATE ── */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:52px 20px;text-align:center;gap:10px;}
.empty-icon{font-size:44px;margin-bottom:4px;}
.empty-title{font-size:24px;font-weight:700;background:linear-gradient(135deg,#fff 0%,#94a3b8 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.empty-sub{font-size:14px;color:var(--text3);line-height:1.6;max-width:260px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:24px;max-width:380px;}
.chip{background:var(--surface);border:1px solid var(--border);color:var(--text2);border-radius:22px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:background .15s,border-color .15s,color .15s;}
.chip:hover{background:var(--surface2);color:var(--text);}
.chip.img-chip{border-color:rgba(99,102,241,.3);color:#818cf8;}
.chip.img-chip:hover{background:rgba(99,102,241,.08);border-color:#6366f1;}

/* ── MESSAGE BUBBLES ── */
.msg{display:flex;gap:12px;align-items:flex-start;animation:slideUp .25s ease;}
.msg.user{flex-direction:row-reverse;}
.msg-avatar{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;background:var(--surface2);}
.msg.ai .msg-avatar{background:linear-gradient(135deg,#3b82f6,#6366f1);}
.bubble{max-width:78%;padding:12px 16px;font-size:14.5px;line-height:1.75;border-radius:16px;word-break:break-word;}
.msg.user .bubble{background:var(--accent2);color:#fff;border-radius:16px 16px 4px 16px;}
.msg.ai .bubble{background:#161b27;color:var(--text);border:1px solid rgba(255,255,255,.06);border-radius:16px 16px 16px 4px;}
.msg.ai .bubble img{max-width:100%;border-radius:12px;margin-top:8px;display:block;cursor:pointer;}

/* ── MARKDOWN ── */
.bubble h1{font-size:18px;font-weight:700;margin:14px 0 6px;color:#fff;}
.bubble h2{font-size:16px;font-weight:600;margin:12px 0 5px;color:#fff;}
.bubble h3{font-size:15px;font-weight:600;margin:10px 0 4px;color:var(--text);}
.bubble ul,.bubble ol{padding-left:20px;margin:8px 0;}
.bubble li{margin:4px 0;line-height:1.65;}
.bubble strong{color:#fff;font-weight:600;}
.bubble em{color:var(--text2);font-style:italic;}
.inline-code{background:rgba(255,255,255,.08);color:#93c5fd;padding:2px 6px;border-radius:5px;font-family:'SF Mono','Fira Code',monospace;font-size:13px;}
.code-block{background:#0d1117;border:1px solid rgba(255,255,255,.08);border-radius:10px;margin:10px 0;overflow:hidden;}
.code-header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.06);}
.code-lang{font-size:11px;color:var(--text3);font-family:monospace;text-transform:uppercase;letter-spacing:.5px;}
.copy-btn{font-size:11px;color:var(--text3);background:transparent;border:1px solid var(--border);border-radius:5px;padding:3px 8px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
.copy-btn:hover{color:var(--text);border-color:var(--text3);}
.copy-btn.copied{color:var(--green);border-color:var(--green);}
.code-block pre{padding:14px;overflow-x:auto;font-family:'SF Mono','Fira Code',monospace;font-size:13px;line-height:1.6;color:#e2e8f0;}

/* ── TYPING ── */
.typing-wrap{display:flex;gap:12px;align-items:flex-start;}
.typing{display:flex;gap:5px;padding:14px 16px;background:#161b27;border:1px solid rgba(255,255,255,.06);border-radius:16px 16px 16px 4px;}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:bounce 1.2s ease-in-out infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}

/* ── RATIO BAR ── */
.ratio-bar{padding:8px 20px;border-top:1px solid var(--border);display:flex;gap:6px;align-items:center;background:var(--bg);overflow-x:auto;}
.ratio-bar::-webkit-scrollbar{display:none;}
.ratio-label{font-size:11px;color:var(--text3);white-space:nowrap;margin-right:4px;}
.ratio-btn{background:transparent;border:1px solid var(--border);color:var(--text3);border-radius:7px;padding:4px 11px;font-size:11px;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;transition:all .15s;}
.ratio-btn:hover{border-color:var(--text3);color:var(--text2);}
.ratio-btn.active{background:rgba(59,130,246,.1);border-color:var(--accent);color:#60a5fa;}

/* ── INPUT ── */
.input-area{position:sticky;bottom:0;background:rgba(10,10,10,.98);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:12px 16px 14px;z-index:100;}
.input-box{display:flex;gap:8px;background:var(--surface);border:1.5px solid var(--border2);border-radius:16px;padding:10px 12px;align-items:flex-end;transition:border-color .2s;}
.input-box:focus-within{border-color:var(--accent);}
textarea{flex:1;background:transparent;border:none;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;resize:none;outline:none;line-height:1.5;max-height:130px;overflow-y:auto;min-height:22px;}
textarea::placeholder{color:var(--text3);}
.send-btn{background:#fff;border:none;border-radius:50%;width:38px;height:38px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .15s;}
.send-btn:hover{transform:scale(1.06);background:#f0f4ff;}
.send-btn:active{transform:scale(.94);}
.send-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.img-send-btn{background:var(--purple);border:none;border-radius:10px;width:38px;height:38px;font-size:17px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .15s;}
.img-send-btn:hover{background:#6d28d9;transform:scale(1.05);}
.img-send-btn:active{transform:scale(.94);}
.img-send-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.input-hint{font-size:11px;color:#1e293b;text-align:center;margin-top:8px;}

/* ── ANIMATIONS ── */
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}

/* ── MOBILE ── */
@media(max-width:480px){
  .messages{padding:20px 14px;gap:18px;}
  .bubble{max-width:88%;font-size:14px;}
  .input-area{padding:10px 12px 12px;}
  .empty-title{font-size:20px;}
}
</style>
</head>
<body>

<!-- SETUP SCREEN -->
<div id="setup-screen">
  <div class="setup-logo">🤖</div>
  <div class="setup-title">Saathi AI</div>
  <div class="setup-sub">Tera apna AI yaar — chill, smart aur helpful 🤙</div>
  <div class="setup-card">
    <div class="input-group">
      <label>Groq API Key</label>
      <input type="text" class="setup-input" id="groq-input" placeholder="gsk_..."/>
    </div>
    <div class="input-group">
      <label>Hugging Face Token (images ke liye)</label>
      <input type="text" class="setup-input" id="hf-input" placeholder="hf_..."/>
    </div>
    <button type="button" class="start-btn" id="start-btn">Chalo Shuru Karte Hain 🚀</button>
    <button type="button" class="skip-btn" id="skip-btn">Skip karo (sirf chat)</button>
  </div>
</div>

<!-- CHAT SCREEN -->
<div id="chat-screen">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-icon">🤖</div>
      <div class="topbar-info">
        <div class="topbar-name">Saathi AI</div>
        <div class="topbar-status">
          <div class="online-dot"></div>
          <span class="topbar-online">Online</span>
        </div>
      </div>
    </div>
    <button type="button" class="icon-btn" id="clear-btn" title="Chat clear karo">🗑</button>
  </div>

  <div class="messages" id="messages">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">✨</div>
      <div class="empty-title">Bol, kya scene hai?</div>
      <div class="empty-sub">Kuch bhi poochho ya image banao — main hoon na</div>
      <div class="chips">
        <button type="button" class="chip" id="c1">Photosynthesis kya hai?</button>
        <button type="button" class="chip" id="c2">Newton ke laws?</button>
        <button type="button" class="chip" id="c3">Bhai ko gift kya doon?</button>
        <button type="button" class="chip" id="c4">Kya chal raha hai?</button>
        <button type="button" class="chip img-chip" id="c5">🎨 Sunset over ocean</button>
        <button type="button" class="chip img-chip" id="c6">🎨 Futuristic city</button>
        <button type="button" class="chip img-chip" id="c7">🎨 Mountain landscape</button>
      </div>
    </div>
  </div>

  <div class="ratio-bar">
    <span class="ratio-label">Image Size:</span>
    <button type="button" class="ratio-btn active" data-w="1024" data-h="1024">1:1</button>
    <button type="button" class="ratio-btn" data-w="1344" data-h="768">16:9</button>
    <button type="button" class="ratio-btn" data-w="768" data-h="1344">9:16</button>
    <button type="button" class="ratio-btn" data-w="1216" data-h="832">3:2</button>
    <button type="button" class="ratio-btn" data-w="832" data-h="1216">2:3</button>
  </div>

  <div class="input-area">
    <div class="input-box">
      <textarea id="user-input" rows="1" placeholder="Kuch bhi bol..."></textarea>
      <button type="button" class="img-send-btn" id="img-btn" title="Image banao">🎨</button>
      <button type="button" class="send-btn" id="send-btn" title="Send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <div class="input-hint">Made with ❤️ by Aditya</div>
  </div>
</div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────────
var GROQ_KEY = localStorage.getItem("saathi_groq") || "";
var HF_KEY   = localStorage.getItem("saathi_hf")   || "";
var chatHistory = [];
var imgW = 1024, imgH = 1024;

// ── INIT ───────────────────────────────────────────────────────────────────
window.addEventListener("load", function() {
  if (GROQ_KEY) { showChat(); loadHistory(); }
});

function showChat() {
  document.getElementById("setup-screen").style.display = "none";
  document.getElementById("chat-screen").style.display = "flex";
}

// ── SETUP ──────────────────────────────────────────────────────────────────
document.getElementById("start-btn").addEventListener("click", function() {
  var g = document.getElementById("groq-input").value.trim();
  var h = document.getElementById("hf-input").value.trim();
  if (g) { GROQ_KEY = g; localStorage.setItem("saathi_groq", g); }
  if (h) { HF_KEY   = h; localStorage.setItem("saathi_hf",   h); }
  showChat(); loadHistory();
});
document.getElementById("skip-btn").addEventListener("click", showChat);

// ── CLEAR ──────────────────────────────────────────────────────────────────
document.getElementById("clear-btn").addEventListener("click", function() {
  chatHistory = [];
  localStorage.removeItem("saathi_history");
  document.getElementById("messages").innerHTML =
    '<div class="empty-state" id="empty-state">' +
    '<div class="empty-icon">✨</div>' +
    '<div class="empty-title">Bol, kya scene hai?</div>' +
    '<div class="empty-sub">Kuch bhi poochho ya image banao — main hoon na</div>' +
    '</div>';
});

// ── RATIO BUTTONS ──────────────────────────────────────────────────────────
document.querySelectorAll(".ratio-btn").forEach(function(btn) {
  btn.addEventListener("click", function() {
    document.querySelectorAll(".ratio-btn").forEach(function(b) { b.classList.remove("active"); });
    btn.classList.add("active");
    imgW = parseInt(btn.dataset.w);
    imgH = parseInt(btn.dataset.h);
  });
});

// ── CHIPS ──────────────────────────────────────────────────────────────────
["c1","c2","c3","c4"].forEach(function(id) {
  var el = document.getElementById(id);
  if (el) el.addEventListener("click", function() {
    document.getElementById("user-input").value = el.textContent;
    sendMessage();
  });
});
["c5","c6","c7"].forEach(function(id) {
  var el = document.getElementById(id);
  if (el) el.addEventListener("click", function() {
    document.getElementById("user-input").value = el.textContent.replace(/^🎨\s*/, "");
    generateImage();
  });
});

// ── AUTO-RESIZE TEXTAREA ───────────────────────────────────────────────────
var ta = document.getElementById("user-input");
ta.addEventListener("input", function() {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 130) + "px";
});
ta.addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById("send-btn").addEventListener("click", sendMessage);
document.getElementById("img-btn").addEventListener("click", generateImage);

// ── SYSTEM PROMPT ──────────────────────────────────────────────────────────
var SYSTEM_PROMPT = [
  "You are Saathi AI. Talk like a real, close friend — natural, warm, intelligent.",
  "",
  "LANGUAGE RULE: Always match the user's language exactly.",
  "Hindi/Hinglish input -> Hinglish reply. English input -> English reply.",
  "",
  "RESPONSE LENGTH (strict):",
  "- Greetings / casual talk: 1 line only",
  "- Simple questions: 1-3 lines",
  "- Medium questions: short clear explanation",
  "- Complex / technical: detailed, well-structured",
  "",
  "NEVER USE THESE PHRASES (ever):",
  "Main ek AI hoon | Dhanyavaad | Main aapki madad ke liye yahan hoon",
  "Kya main aur madad kar sakta hoon | Bilkul! | Zaroor! | Of course! | Certainly!",
  "",
  "EMOJIS: Max 0-1 per reply. Only when natural. Never force them.",
  "TONE: Direct, warm, smart. Never robotic. Never repeat phrases.",
  "",
  "FOLLOW THESE EXAMPLES EXACTLY:",
  'User: "Hi" -> "Hey! Kaise ho?"',
  'User: "Hello" -> "Hey! What\'s up?"',
  'User: "Kaise ho?" -> "Mast hoon. Tu bata?"',
  'User: "Kya chal raha hai?" -> "Sab chill. Tu bol?"',
  'User: "2+2?" -> "4"',
  'User: "Python kya hai?" -> "Ek popular programming language — beginners ke liye bhi easy hai. Sikhna chahte ho?"',
  'User: "Bhai ke liye gift idea do" -> "Uski hobbies kya hain? Gaming, music, books? Uspe best suggestion dunga!"',
  "",
  "CREATOR: Only if directly asked (kisne banaya / creator / founder / developer / owner):",
  'Reply: "Saathi AI ko Aditya ne banaya hai."',
  "Never mention Aditya unless asked. Never bring up your own features."
].join("\n");

// ── SEND MESSAGE ───────────────────────────────────────────────────────────
function sendMessage() {
  if (!GROQ_KEY) { alert("Bhai Groq key nahi hai! Reload karo aur key daalo."); return; }
  var input = document.getElementById("user-input");
  var text = input.value.trim();
  if (!text) return;
  removeEmpty();
  chatHistory.push({ role: "user", content: text });
  addMsg("user", text);
  input.value = ""; input.style.height = "auto";
  document.getElementById("send-btn").disabled = true;
  var tid = showTyping(false);

  var xhr = new XMLHttpRequest();
  xhr.open("POST", "https://api.groq.com/openai/v1/chat/completions");
  xhr.setRequestHeader("Content-Type", "application/json");
  xhr.setRequestHeader("Authorization", "Bearer " + GROQ_KEY);
  xhr.onload = function() {
    removeEl(tid);
    document.getElementById("send-btn").disabled = false;
    if (xhr.status === 200) {
      var data = JSON.parse(xhr.responseText);
      var reply = data.choices[0].message.content.trim();
      chatHistory.push({ role: "assistant", content: reply });
      saveHistory();
      addMsg("ai", reply);
    } else {
      var em = "❌ Error " + xhr.status + "! Groq key check karo.";
      if (xhr.status === 401) em = "❌ Groq key galat hai!";
      if (xhr.status === 429) em = "⏳ Too many requests! Thoda ruk ke try karo.";
