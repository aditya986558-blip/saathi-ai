<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Saathi AI 🤖</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Baloo 2', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #1a1a2e, #16213e);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
      color: #e2e8f0;
    }
    .header { text-align: center; margin-bottom: 20px; }
    .header .emoji-h { font-size: 46px; display: block; }
    .header h1 { font-size: 30px; font-weight: 800; color: #f59e0b; text-shadow: 0 0 24px rgba(245,158,11,0.5); letter-spacing: 2px; }
    .header .tagline { background: linear-gradient(90deg, #f59e0b, #ec4899, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 13px; font-weight: 600; margin-top: 4px; }
    .chat-box { width: 100%; max-width: 680px; background: rgba(255,255,255,0.04); border: 1px solid rgba(245,158,11,0.25); border-radius: 20px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.4); }
    .key-bar { padding: 12px 16px; background: rgba(0,0,0,0.3); border-bottom: 1px solid rgba(245,158,11,0.15); display: flex; gap: 8px; align-items: center; }
    .key-bar input { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(245,158,11,0.3); border-radius: 10px; padding: 8px 12px; color: #e2e8f0; font-size: 12px; font-family: monospace; outline: none; }
    .key-bar input:focus { border-color: #f59e0b; }
    .key-bar button.save { background: linear-gradient(135deg, #f59e0b, #d97706); border: none; border-radius: 10px; padding: 8px 14px; font-size: 12px; font-weight: 800; color: #000; cursor: pointer; font-family: 'Baloo 2', sans-serif; }
    .key-bar button.clear { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; border-radius: 10px; padding: 8px 10px; font-size: 12px; color: #ef4444; cursor: pointer; }
    .key-status { font-size: 11px; padding: 4px 8px; border-radius: 8px; white-space: nowrap; }
    .key-status.ready { background: rgba(34,197,94,0.2); color: #22c55e; }
    .key-status.error { background: rgba(239,68,68,0.2); color: #ef4444; }
    .messages { min-height: 300px; max-height: 420px; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; }
    .empty-state { text-align: center; margin: auto; }
    .empty-state .big { font-size: 44px; display: block; margin-bottom: 8px; }
    .empty-state h3 { color: #94a3b8; font-size: 15px; font-weight: 600; }
    .empty-state p { color: #64748b; font-size: 12px; margin-top: 4px; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
    .suggestion-btn { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); color: #fbbf24; border-radius: 20px; padding: 7px 14px; font-size: 12px; cursor: pointer; font-family: 'Baloo 2', sans-serif; }
    .msg { display: flex; align-items: flex-start; gap: 8px; }
    .msg.user { flex-direction: row-reverse; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #f59e0b, #d97706); display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
    .bubble { max-width: 78%; padding: 10px 14px; font-size: 14px; line-height: 1.7; border-radius: 18px; }
    .msg.user .bubble { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; border-radius: 18px 18px 4px 18px; font-weight: 600; }
    .msg.ai .bubble { background: rgba(255,255,255,0.07); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.1); border-radius: 18px 18px 18px 4px; }
    .typing-bubble { display: flex; align-items: center; gap: 8px; }
    .typing-dots { display: flex; gap: 5px; padding: 12px 16px; background: rgba(255,255,255,0.07); border-radius: 18px; border: 1px solid rgba(255,255,255,0.1); }
    .typing-dots span { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; animation: bounce 1.2s infinite; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    .input-area { padding: 14px 16px; border-top: 1px solid rgba(255,255,255,0.06); display: flex; gap: 10px; background: rgba(0,0,0,0.2); }
    textarea { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(245,158,11,0.25); border-radius: 14px; padding: 11px 14px; color: #e2e8f0; font-size: 14px; font-family: 'Baloo 2', sans-serif; resize: none; outline: none; line-height: 1.5; }
    textarea:focus { border-color: #f59e0b; }
    textarea::placeholder { color: #475569; }
    .send-btn { background: linear-gradient(135deg, #f59e0b, #d97706); border: none; border-radius: 14px; width: 48px; height: 48px; font-size: 20px; cursor: pointer; flex-shrink: 0; }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .bottom-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; width: 100%; max-width: 680px; }
    .clear-btn { background: transparent; border: 1px solid rgba(255,255,255,0.12); color: #64748b; border-radius: 20px; padding: 6px 16px; font-size: 12px; cursor: pointer; font-family: 'Baloo 2', sans-serif; }
    .footer { font-size: 11px; color: #1e293b; margin-top: 20px; text-align: center; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
  </style>
</head>
<body>
  <div class="header">
    <span class="emoji-h">🤖✨</span>
    <h1>⚡ Saathi AI 🧠</h1>
    <p class="tagline">🌟 Tumhara Smart Dost • Har Sawaal Ka Jawab 🚀</p>
  </div>
  <div class="chat-box">
    <div class="key-bar">
      <input type="password" id="api-key-input" placeholder="🔑 Groq key paste karo..." />
      <button class="save" onclick="saveKey()">✅ Save</button>
      <button class="clear" onclick="clearKey()">✕</button>
      <span class="key-status error" id="key-status">❌</span>
    </div>
    <div class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <span class="big">🌈💫</span>
        <h3>🔥 Koi bhi sawaal daaro, jhijhko mat!</h3>
        <p>📚 Science • 🧮 Maths • 🌍 History • 💡 GK • 🎁 Gift Ideas</p>
        <div class="suggestions">
          <button class="suggestion-btn" onclick="quickSend(this)">🌿 Photosynthesis kya hai?</button>
          <button class="suggestion-btn" onclick="quickSend(this)">⚡ Newton ke laws?</button>
          <button class="suggestion-btn" onclick="quickSend(this)">🎁 Bhai ko gift kya doon?</button>
          <button class="suggestion-btn" onclick="quickSend(this)">🧮 Pythagoras theorem?</button>
          <button class="suggestion-btn" onclick="quickSend(this)">😊 Kaise ho tum?</button>
        </div>
      </div>
    </div>
    <div class="input-area">
      <textarea id="user-input" rows="1" placeholder="✍️ Apna sawaal yahan likho..." onkeydown="handleKey(event)"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>
  <div class="bottom-bar">
    <button class="clear-btn" onclick="clearChat()">🗑️ Chat saaf karo</button>
    <span style="font-size:11px;color:#334155;">Groq Free ✅</span>
  </div>
  <p class="footer">🤖 Saathi AI · Made by Aditya 💛</p>

<script>
let GROQ_KEY = "";
let chatHistory = [];

function saveKey() {
  const val = document.getElementById("api-key-input").value.trim();
  if (val.length < 10) {
    alert("⚠️ Key galat hai! gsk_ se shuru honi chahiye!");
    return;
  }
  GROQ_KEY = val;
  document.getElementById("key-status").textContent = "✅ Ready!";
  document.getElementById("key-status").className = "key-status ready";
  document.getElementById("api-key-input").value = "●●●●●●●●●●●●●●●●●●●●";
}

function clearKey() {
  GROQ_KEY = "";
  document.getElementById("api-key-input").value = "";
  document.getElementById("key-status").textContent = "❌";
  document.getElementById("key-status").className = "key-status error";
}

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function quickSend(btn) {
  document.getElementById("user-input").value = btn.textContent.slice(2);
  sendMessage();
}

async function sendMessage() {
  if (!GROQ_KEY) {
    alert("⚠️ Pehle Groq API key daalo aur Save karo!");
    return;
  }
  const input = document.getElementById("user-input");
  const text = input.value.trim();
  if (!text) return;

  const emptyState = document.getElementById("empty-state");
  if (emptyState) emptyState.remove();

  chatHistory.push({ role: "user", content: text });
  addMessage("user", text);
  input.value = "";

  document.getElementById("send-btn").disabled = true;
  const typingId = showTyping();

  try {
    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + GROQ_KEY
      },
      body: JSON.stringify({
        model: llama-3.1-8b-instant
        max_tokens: 800,
        messages: [
          {
            role: "system",
            content: "Tum Saathi AI ho — Aditya ke banaye hue smart AI dost. Aditya ne tumhe banaya hai. Jab koi pooche ki tumhe kisne banaya toh kaho 'Mujhe Aditya bhai ne banaya hai! 😊'. Hindi mein pooche toh Hindi mein jawab do, English mein pooche toh English mein. Har jawab mein emojis use karo. Warm aur friendly raho. 💛"
          },
          ...chatHistory
        ]
      })
    });

    removeTyping(typingId);

    if (!response.ok) {
      const err = await response.json();
      console.error("Groq Error:", err);
      addMessage("ai", "❌ Error: " + (err.error?.message || "Kuch gadbad hui!"));
      document.getElementById("send-btn").disabled = false;
      return;
    }

    const data = await response.json();
    const reply = data.choices[0].message.content;
    chatHistory.push({ role: "assistant", content: reply });
    addMessage("ai", reply);

  } catch(e) {
    removeTyping(typingId);
    console.error("Fetch Error:", e);
    addMessage("ai", "❌ Internet check karo aur dobara try karo! 🙏");
  }

  document.getElementById("send-btn").disabled = false;
}

function addMessage(role, text) {
  const container = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg " + role;
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "👤" : "🤖";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = text.replace(/\n/g, "<br>").replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
  div.appendChild(avatar);
  div.appendChild(bubble);
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function showTyping() {
  const container = document.getElementById("messages");
  const id = "t" + Date.now();
  const div = document.createElement("div");
  div.className = "typing-bubble";
  div.id = id;
  div.innerHTML = '<div class="avatar">🤖</div><div class="typing-dots"><span></span><span></span><span></span></div>';
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return id;
}

function removeTyping(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function clearChat() {
  chatHistory = [];
  const container = document.getElementById("messages");
  container.innerHTML = '<div class="empty-state" id="empty-state"><span class="big">🌈💫</span><h3>🔥 Koi bhi sawaal daaro!</h3><p>📚 Science • 🧮 Maths • 🌍 History • 💡 GK • 🎁 Gift Ideas</p><div class="suggestions"><button class="suggestion-btn" onclick="quickSend(this)">🌿 Photosynthesis kya hai?</button><button class="suggestion-btn" onclick="quickSend(this)">⚡ Newton ke laws?</button><button class="suggestion-btn" onclick="quickSend(this)">🎁 Bhai ko gift kya doon?</button><button class="suggestion-btn" onclick="quickSend(this)">🧮 Pythagoras theorem?</button><button class="suggestion-btn" onclick="quickSend(this)">😊 Kaise ho tum?</button></div></div>';
}
</script>
</body>
  </html>
