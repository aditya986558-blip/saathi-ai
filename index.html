<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Saathi AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:         #07070f;
      --bg-2:       #0e0e1a;
      --bg-3:       #141424;
      --bg-hover:   #1a1a2c;
      --border:     #1e1e30;
      --border-hi:  #2e2e48;
      --focus:      #4f6ef7;
      --text:       #eeeef6;
      --text-2:     #9898b2;
      --text-3:     #50506a;
      --blue:       #4f6ef7;
      --purple:     #7c5af3;
      --grad:       linear-gradient(135deg,#4f6ef7 0%,#7c5af3 100%);
      --user-bg:    #1d3fa8;
      --ai-bg:      #0e0e1a;
      --font:       'Outfit', sans-serif;
      --mono:       'JetBrains Mono', monospace;
      --radius:     16px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    ::selection { background: rgba(79,110,247,.28); }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ─── SCREENS ─── */
    .screen { display: none; width: 100%; min-height: 100vh; }
    .screen.active { display: flex; }

    /* ─── SETUP SCREEN ─── */
    #setup-screen {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(ellipse 70% 50% at 15% 10%,  rgba(79,110,247,.1) 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 85% 90%, rgba(124,90,243,.08) 0%, transparent 55%),
        var(--bg);
    }

    .setup-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow: 0 28px 56px -14px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.03);
      animation: cardIn .5s cubic-bezier(.16,1,.3,1) both;
    }

    @keyframes cardIn {
      from { transform: translateY(18px) scale(.97); opacity: 0; }
      to   { transform: translateY(0)    scale(1);   opacity: 1; }
    }

    .setup-logo {
      width: 64px; height: 64px;
      background: var(--grad);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px;
      margin: 0 auto 20px;
      box-shadow: 0 10px 28px rgba(79,110,247,.45);
    }

    .setup-title {
      text-align: center;
      font-size: 30px; font-weight: 800; letter-spacing: -.5px;
      color: #fff; margin-bottom: 6px;
    }

    .setup-sub {
      text-align: center;
      font-size: 14px; color: var(--text-2);
      margin-bottom: 24px; line-height: 1.6;
    }

    .setup-section-label {
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.2px;
      color: var(--blue); margin-bottom: 14px;
      display: flex; align-items: center; gap: 6px;
    }

    .field-label {
      display: block;
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.2px;
      color: var(--text-3); margin-bottom: 8px;
    }

    .field-input {
      width: 100%;
      background: rgba(0,0,0,.45);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 14px; font-family: var(--mono);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      margin-bottom: 14px;
    }

    .field-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(79,110,247,.15);
    }

    .field-input::placeholder {
      color: var(--text-3);
      font-family: var(--font); letter-spacing: 0;
    }

    .field-optional {
      font-size: 10px; color: var(--text-3);
      margin-top: -10px; margin-bottom: 14px;
    }

    .btn-primary {
      width: 100%;
      background: #fff; color: #000;
      border: none; border-radius: 12px;
      padding: 14px;
      font-size: 15px; font-weight: 700; font-family: var(--font);
      cursor: pointer;
      transition: background .2s, transform .15s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 8px;
    }

    .btn-primary:hover  { background: #ebebf5; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }

    .err-banner {
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.25);
      color: #f87171;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .setup-hint {
      text-align: center;
      font-size: 12px; color: var(--text-3);
      margin-top: 16px; line-height: 1.7;
    }

    .setup-hint a { color: var(--blue); text-decoration: none; }
    .setup-hint a:hover { text-decoration: underline; }

    .divider {
      border: none; border-top: 1px solid var(--border);
      margin: 20px 0;
    }

    /* ─── CHAT SCREEN ─── */
    #chat-screen {
      flex-direction: column;
      height: 100vh; max-height: 100vh;
      overflow: hidden;
    }

    /* NAVBAR */
    .navbar {
      background: rgba(7,7,15,.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0; z-index: 50;
    }

    .nav-left { display: flex; align-items: center; gap: 10px; }

    .nav-logo {
      width: 36px; height: 36px;
      background: transparent;
      border: none;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; flex-shrink: 0;
      filter: drop-shadow(0 0 8px rgba(79,110,247,.5));
      transition: transform .3s ease;
    }
    .nav-logo.floating {
      animation: navLogoFloat 1.8s ease-in-out infinite;
    }
    @keyframes navLogoFloat {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    .nav-name  { font-size: 16px; font-weight: 700; color: #fff; line-height: 1.2; }
    .nav-status {
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; color: var(--text-2);
    }

    .status-dot {
      width: 7px; height: 7px;
      background: #22c55e; border-radius: 50%;
      box-shadow: 0 0 7px #22c55e;
      animation: blink 2.5s infinite;
    }

    @keyframes blink {
      0%,100% { opacity: 1; }
      50%      { opacity: .45; }
    }

    .nav-right { display: flex; align-items: center; gap: 6px; }

    .nav-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-2);
      border-radius: 10px;
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all .2s;
    }

    .nav-btn:hover {
      background: var(--bg-hover);
      color: var(--text);
      border-color: var(--border-hi);
    }

    /* MESSAGES AREA */
    .msgs-area {
      flex: 1; overflow-y: auto;
      padding: 28px 16px 16px;
    }

    .msgs-inner {
      max-width: 720px; margin: 0 auto;
      display: flex; flex-direction: column;
      gap: 22px; min-height: 100%;
    }

    /* WELCOME */
    .welcome {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 48px 20px;
      margin: auto 0;
      animation: fadeUp .5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .welcome-icon {
      font-size: 54px; display: block;
      margin-bottom: 18px;
      animation: floatIcon 3s ease-in-out infinite;
    }

    @keyframes floatIcon {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }

    .welcome-title {
      font-size: 28px; font-weight: 800;
      color: #fff; letter-spacing: -.5px;
      margin-bottom: 8px;
    }

    .welcome-sub {
      font-size: 14px; color: var(--text-2);
      max-width: 380px; line-height: 1.65;
      margin-bottom: 36px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 10px;
      width: 100%; max-width: 560px;
    }

    @media (max-width: 500px) { .cards-grid { grid-template-columns: 1fr; } }

    .sug-card {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      text-align: left; cursor: pointer;
      transition: all .2s cubic-bezier(.16,1,.3,1);
    }

    .sug-card:hover {
      background: var(--bg-hover);
      border-color: rgba(79,110,247,.4);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0,0,0,.35);
    }

    .sug-card .ci  { font-size: 18px; margin-bottom: 6px; display: block; }
    .sug-card .ct  { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.4; }
    .sug-card .cs  { font-size: 11px; color: var(--text-2); margin-top: 2px; }

    /* MESSAGE ROWS */
    .msg-row {
      display: flex; gap: 12px; align-items: flex-start;
      animation: msgIn .35s cubic-bezier(.16,1,.3,1) both;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { flex-direction: row-reverse; }

    .msg-av {
      width: 32px; height: 32px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
    }

    .msg-row.user .msg-av { background: #1e2a3e; }
    .msg-row.ai  .msg-av  { background: transparent; font-size: 22px; }

    .msg-body {
      max-width: calc(100% - 48px);
      display: flex; flex-direction: column; gap: 4px;
    }

    .msg-row.user .msg-body { align-items: flex-end; }

    .bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14.5px; line-height: 1.68;
      word-break: break-word;
    }

    .msg-row.user .bubble {
      background: var(--user-bg); color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg-row.ai .bubble {
      background: var(--ai-bg); color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    /* Attachment preview in user bubble */
    .attach-preview {
      max-width: 260px;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .attach-preview img {
      width: 100%; display: block;
      border-radius: 12px;
    }
    .attach-file-badge {
      background: rgba(255,255,255,.12);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: #fff;
      margin-bottom: 6px;
    }

    /* Generated image in AI bubble */
    .gen-image-wrap {
      margin: 8px 0;
      border-radius: 12px;
      overflow: hidden;
      max-width: 400px;
    }
    .gen-image-wrap img {
      width: 100%; display: block;
      border-radius: 12px;
    }
    .gen-image-loading {
      background: var(--bg-3);
      border: 1px dashed var(--border-hi);
      border-radius: 12px;
      padding: 32px;
      text-align: center;
      color: var(--text-2);
      font-size: 13px;
    }

    /* Markdown inside bubble */
    .bubble p            { margin-bottom: 10px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble strong       { color: #fff; font-weight: 600; }
    .bubble em           { font-style: italic; color: #c4c4dd; }
    .bubble h1           { font-size: 18px; font-weight: 700; color: #fff; margin: 14px 0 6px; }
    .bubble h2           { font-size: 16px; font-weight: 700; color: #fff; margin: 12px 0 6px; }
    .bubble h3           { font-size: 14px; font-weight: 700; color: #fff; margin: 10px 0 4px; }
    .bubble ul, .bubble ol { margin: 6px 0 10px 20px; }
    .bubble li           { margin-bottom: 4px; line-height: 1.55; }
    .bubble hr           { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
    .bubble code {
      font-family: var(--mono);
      background: rgba(255,255,255,.1);
      padding: 2px 7px; border-radius: 5px;
      font-size: 13px; color: #a5b4fc;
    }

    /* Code block */
    .code-block {
      background: #050509;
      border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
      margin: 12px 0;
    }

    .code-top {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 14px;
      background: rgba(255,255,255,.025);
      border-bottom: 1px solid var(--border);
    }

    .code-lang { font-size: 11px; color: var(--text-3); font-family: var(--mono); }

    .copy-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-2);
      padding: 4px 10px; border-radius: 6px;
      font-size: 11px; cursor: pointer;
      display: flex; align-items: center; gap: 4px;
      transition: all .2s; font-family: var(--font);
    }

    .copy-btn:hover { background: var(--bg-hover); color: var(--text); border-color: var(--border-hi); }
    .copy-btn.ok    { color: #22c55e; border-color: rgba(34,197,94,.3); }

    .code-pre {
      padding: 16px; overflow-x: auto;
      font-family: var(--mono);
      font-size: 13px; line-height: 1.6;
      color: #c4cfe8; white-space: pre;
    }

    /* Typing indicator */
    .typing-row { display: flex; gap: 12px; align-items: flex-start; }

    .typing-dots {
      background: var(--ai-bg);
      border: 1px solid var(--border);
      border-radius: 18px; border-bottom-left-radius: 4px;
      padding: 16px 18px;
      display: flex; gap: 5px; align-items: center;
    }

    .typing-dots span {
      width: 6px; height: 6px;
      background: var(--text-2); border-radius: 50%;
      animation: typDot 1.4s infinite ease-in-out both;
    }

    .typing-dots span:nth-child(1) { animation-delay: -.32s; }
    .typing-dots span:nth-child(2) { animation-delay: -.16s; }

    @keyframes typDot {
      0%,80%,100% { transform: scale(.55); opacity: .4; }
      40%          { transform: scale(1);   opacity: 1;  }
    }

    /* ─── INPUT BAR (ChatGPT style) ─── */
    .input-section {
      flex-shrink: 0;
      padding: 10px 16px 22px;
      background: var(--bg);
      border-top: 1px solid rgba(255,255,255,.03);
    }

    .input-inner { max-width: 720px; margin: 0 auto; }

    /* Attachment preview strip */
    .attach-strip {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .attach-thumb {
      position: relative;
      width: 64px; height: 64px;
      border-radius: 10px; overflow: hidden;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .attach-thumb img { width: 100%; height: 100%; object-fit: cover; }

    .attach-thumb-file {
      width: 64px; height: 64px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-3);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-size: 20px; gap: 4px;
      flex-shrink: 0; position: relative;
    }

    .attach-thumb-file span { font-size: 9px; color: var(--text-3); }

    .attach-remove {
      position: absolute; top: 3px; right: 3px;
      background: rgba(0,0,0,.75);
      border: none; color: #fff;
      border-radius: 50%;
      width: 18px; height: 18px;
      font-size: 10px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
    }

    .input-box {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 0;
      display: flex; flex-direction: column;
      transition: border-color .2s, box-shadow .2s;
      overflow: hidden;
    }

    .input-box:focus-within {
      border-color: rgba(79,110,247,.5);
      box-shadow: 0 0 0 1px rgba(79,110,247,.12);
    }

    .input-ta {
      flex: 1; background: transparent; border: none;
      color: var(--text);
      font-size: 15px; font-family: var(--font);
      resize: none; outline: none;
      line-height: 1.5;
      padding: 14px 18px 4px;
      max-height: 160px; overflow-y: auto;
    }

    .input-ta::placeholder { color: var(--text-3); }

    /* Bottom row of input box */
    .input-bottom-row {
      display: flex; align-items: center;
      padding: 6px 8px 8px;
      gap: 6px;
    }

    /* + button (attach) */
    .attach-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      transition: all .2s;
    }

    .attach-btn:hover {
      background: var(--bg-hover);
      color: var(--text);
      border-color: var(--border-hi);
    }

    /* spacer */
    .input-spacer { flex: 1; }

    /* Send button — white circle like ChatGPT */
    .send-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: none;
      background: #fff; color: #000;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      transition: background .2s, transform .15s, box-shadow .2s;
    }

    .send-btn:hover:not(:disabled) {
      background: #ebebf5;
      transform: scale(1.06);
      box-shadow: 0 4px 12px rgba(255,255,255,.15);
    }

    .send-btn:active:not(:disabled) { transform: scale(.95); }

    .send-btn:disabled {
      background: var(--bg-3);
      color: var(--text-3);
      cursor: not-allowed;
    }

    .input-hint {
      font-size: 11px; color: var(--text-3);
      text-align: center; margin-top: 10px;
    }

    /* Attach popup menu */
    .attach-menu {
      position: fixed;
      bottom: auto; left: auto;
      background: var(--bg-2);
      border: 1px solid var(--border-hi);
      border-radius: 16px;
      padding: 8px;
      display: none;
      flex-direction: column; gap: 4px;
      box-shadow: 0 8px 40px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.04);
      min-width: 210px;
      z-index: 999;
      animation: menuIn .22s cubic-bezier(.16,1,.3,1) both;
    }

    @keyframes menuIn {
      from { opacity: 0; transform: translateY(10px) scale(.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .attach-menu.open { display: flex; }

    .attach-menu-wrap { position: relative; }

    .attach-menu-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px;
      border-radius: 11px;
      cursor: pointer;
      font-size: 14px; font-weight: 500; color: var(--text);
      transition: background .15s;
      border: none; background: transparent;
      font-family: var(--font); text-align: left;
      width: 100%;
    }

    .attach-menu-item:hover { background: var(--bg-hover); }
    .attach-menu-item .ami {
      width: 34px; height: 34px;
      border-radius: 9px;
      background: var(--bg-3);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }

    /* MODAL */
    .modal-ov {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.78);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: none; align-items: center; justify-
